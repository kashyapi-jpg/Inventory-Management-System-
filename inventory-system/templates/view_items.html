<!DOCTYPE html>
<html>
<head>
  <title>All Items</title>
</head>
<body>
  <h2>Inventory Items</h2>
  <table border="1">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Quantity</th>
      <th>Price</th>
    </tr>
    {% for item in items %}
    <tr>
      <td>{{ item.id }}</td>
      <td>{{ item.name }}</td>
      <td>{{ item.quantity }}</td>
      <td>{{ item.price }}</td>
    </tr>
    {% endfor %}
  </table>
  <a href="/dashboard">Back</a>
</body>
</html>
